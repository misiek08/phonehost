global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    host: note9pro

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {instance: note9pro}

  - job_name: victoriametrics
    static_configs:
      - targets: ["127.0.0.1:8428"]
        labels: {instance: note9pro}

  - job_name: vmalert
    static_configs:
      - targets: ["127.0.0.1:8880"]
        labels: {instance: note9pro}

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: {instance: note9pro}

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:3000"]
        labels: {instance: note9pro}
