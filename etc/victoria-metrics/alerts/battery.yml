groups:
  - name: battery
    interval: 30s
    rules:
      # The charge cap is enforced by the pm6150_chg module plus the chargecap
      # daemon (see kernel/pm6150-chg/README.md). These rules watch that it
      # keeps working rather than warning about the level itself.
      - alert: ChargeCapUnavailable
        expr: chargecap_available == 0 or absent(chargecap_available)
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Charge cap not in control"
          description: "chargecap cannot reach charge_behaviour - is the pm6150_chg module loaded (a kernel upgrade unloads it)?"

      - alert: ChargeCapWriteErrors
        expr: sum without(instance) (rate(chargecap_write_errors_total[10m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "chargecap cannot write charge_behaviour"

      # A descent that is already under way is the cap working, not failing.
      - alert: BatteryAboveBand
        expr: |
          (
            node_power_supply_capacity{power_supply="qcom_qg"}
              > on(instance) (chargecap_band_percent{bound="upper"} + 5)
          )
          unless on(instance) (chargecap_behaviour{mode="force-discharge"} == 1)
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: "Battery at {{ $value }}%, well above the configured band"
          description: "The cap is not bringing the level down; check the chargecap log and /sys/kernel/pm6150_chg/regs."

      - alert: BatteryFull
        expr: node_power_supply_capacity{power_supply="qcom_qg"} >= 100
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Battery held at 100% for 30m - the charge cap has failed"

      # A deliberate descent into the band also drains the battery, so exclude
      # it; otherwise every cap cycle would look like a power cut.
      - alert: MainsPowerLost
        expr: |
          (
            node_power_supply_capacity{power_supply="qcom_qg"}
              - (node_power_supply_capacity{power_supply="qcom_qg"} offset 30m) <= -3
          )
          unless on(instance) (chargecap_behaviour{mode="force-discharge"} == 1)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Battery draining - mains power likely lost"
          description: "Charge level dropped {{ $value }} points over 30 minutes with no deliberate discharge in progress."

      - alert: BatteryLow
        expr: node_power_supply_capacity{power_supply="qcom_qg"} < 25
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Battery {{ $value }}%"

      - alert: BatteryCritical
        expr: node_power_supply_capacity{power_supply="qcom_qg"} < 10
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Battery {{ $value }}% - shutdown imminent"

      - alert: BatteryTempHigh
        expr: node_power_supply_temp_celsius{power_supply="qcom_qg"} > 42
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Battery at {{ $value | printf \"%.1f\" }} C"

      - alert: BatteryHealthDegraded
        expr: 100 * node_power_supply_charge_full{power_supply="qcom_qg"} / node_power_supply_charge_full_design{power_supply="qcom_qg"} < 80
        for: 6h
        labels: {severity: info}
        annotations:
          summary: "Battery capacity at {{ $value | printf \"%.0f\" }}% of design"
