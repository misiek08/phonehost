# WiFi power save made this host look dead from the LAN: the association stayed
# up for 14 h with no disconnect in the logs, yet pings took 3-180 ms (measured
# min 3.1 / avg 71.7 / max 180.5) because the radio only woke on DTIM beacons,
# and ARP could be missed long enough for a router to give up on the client.
#
# 2 = disable. Measured after: avg 4.8 ms, max 7.1 ms.
[connection]
wifi.powersave=2
