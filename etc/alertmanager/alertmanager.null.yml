# Placeholder config: alerts are grouped and visible in the Alertmanager UI
# (http://192.168.1.79:9093) but not delivered anywhere.
# Enable Telegram delivery with:
#   sudo set-telegram-alerts <bot_token> <chat_id>
global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: 'null'

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [alertname, instance]
