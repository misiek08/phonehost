# /etc/conf.d/<service> for a container started from examples/container-service

# Image to run and extra podman run arguments.
container_image="localhost/hello-go"
container_args="-v /sys/class/power_supply:/sys/class/power_supply:ro"

# User the container runs as (rootless).
container_user="user"

# Kernel-enforced limits for the whole service cgroup. OpenRC writes these to
# /sys/fs/cgroup/openrc.<service>/ before starting the daemon, so they apply to
# podman, conmon and the container alike - no cgroup delegation needed.
# Format: one "file value" per line.
rc_cgroup_settings="
memory.max 200M
pids.max 128
cpu.max 50000 100000
"
